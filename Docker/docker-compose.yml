services:

  mysql:
    image: mysql:8.0
    container_name: mysql-container
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: practice_db
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./server/schema.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - my-app-network

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: nikngr/node-backend:latest
    container_name: node-container
    ports:
      - "5000:5000"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: practice_db
      PORT: 5000
    depends_on:
      - mysql
    networks:
      - my-app-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: nikngr/react-frontend:latest
    container_name: react-container
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - my-app-network

networks:
  my-app-network:

volumes:
  mysql-data: